name: Security Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Secret and private material scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '(AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' . --exclude-dir=.git --exclude-dir=.gradle --exclude='*.md' --exclude='.env.example'
      - name: Check unsafe client configuration
        run: |
          test -f app/src/main/assets/config.json
          ! grep -E 'GEMINI_API_KEY|GROQ_API_KEY|SERVICE_ROLE|SUPABASE_ACCESS_TOKEN' app/src/main/assets/config.json
      - name: Check security migrations and RLS
        run: |
          test -f supabase/migrations/0017_security_identity_rate_limits.sql
          test -f supabase/migrations/0018_account_sessions_devices.sql
          grep -q 'enable row level security' supabase/migrations/0017_security_identity_rate_limits.sql
          grep -q 'enable row level security' supabase/migrations/0018_account_sessions_devices.sql
