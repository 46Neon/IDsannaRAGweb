name: Pull Request Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dangerous client secrets
        run: |
          ! grep -RInE '(GEMINI_API_KEY|GROQ_API_KEY|OPENAI_API_KEY|SUPABASE_SERVICE_ROLE_KEY)[[:space:]]*=' . \
            --exclude-dir=.git --exclude-dir=.gradle --exclude='*.md' --exclude='.env.example'
      - name: Check required architecture folders
        run: |
          for path in app supabase supabase/migrations docs tests; do test -d "$path"; done
      - name: Report scope
        run: |
          echo "PR validation completed: architecture folders and client secret policy checked."
