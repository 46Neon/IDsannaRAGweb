name: Android Manifest Validation
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-manifest.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check Android manifest and resources
        run: gradle processDebugResources --no-daemon --stacktrace
