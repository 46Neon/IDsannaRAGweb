name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate structure
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f supabase/migrations/0002_idsanna_core.sql
      - name: Unit tests, lint and debug build
        run: gradle test lintDebug assembleDebug --no-daemon --stacktrace
      - name: Scan private material
        run: |
          ! grep -RInE '(AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' . \
            --exclude-dir=.git --exclude-dir=.gradle --exclude='*.apk' --exclude='*.md' --exclude='.env.example'
      - uses: actions/upload-artifact@v4
        with:
          name: idsanna-rag-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
